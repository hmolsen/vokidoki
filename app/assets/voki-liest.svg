<svg xmlns="http://www.w3.org/2000/svg" viewBox="270.6 268.9 1507.6 1507.6"><style>
.pupille { animation: lesen 5.2s linear infinite; }
.blatt { transform-box: fill-box; transform-origin: 50% 100%; animation: wippen 2.6s ease-in-out infinite; }
.marker { animation: zeile 5.2s linear infinite; }
@keyframes lesen {
  0%   { transform: translate(-26px, 16px); }
  21%  { transform: translate(26px, 16px); }
  25%  { transform: translate(-26px, 22px); }
  46%  { transform: translate(26px, 22px); }
  50%  { transform: translate(-26px, 27px); }
  71%  { transform: translate(26px, 27px); }
  75%  { transform: translate(-26px, 32px); }
  96%  { transform: translate(26px, 32px); }
  100% { transform: translate(-26px, 16px); }
}
@keyframes zeile {
  0%   { transform: translate(0, 0) scaleX(0); }
  21%  { transform: translate(0, 0) scaleX(1); }
  25%  { transform: translate(0, 62px) scaleX(0); }
  46%  { transform: translate(0, 62px) scaleX(1); }
  50%  { transform: translate(0, 124px) scaleX(0); }
  71%  { transform: translate(0, 124px) scaleX(1); }
  75%  { transform: translate(0, 186px) scaleX(0); }
  96%  { transform: translate(0, 186px) scaleX(1); }
  100% { transform: translate(0, 0) scaleX(0); }
}
@keyframes wippen { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(-1deg); } }
@media (prefers-reduced-motion: reduce) { .pupille, .blatt, .marker { animation: none; } }
